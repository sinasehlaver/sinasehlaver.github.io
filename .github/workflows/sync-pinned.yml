# For the published site repo (root = contents of job/site, plus scripts/sync-pinned.mjs copied to scripts/).
# Keeps projects.items[source:"pinned"] in content.js in sync with the GitHub profile's pinned repos.
name: sync-pinned

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync pinned repos
        run: node scripts/sync-pinned.mjs --owner "${{ github.repository_owner }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          if git diff --quiet -- content.js; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content.js
          git commit -m "chore: sync pinned repos"
          git push
