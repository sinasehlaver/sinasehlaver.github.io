<!doctype html>
<html lang="en" data-palette="nord" data-accent="indigo" data-type="system" data-shape="pill" data-density="comfortable" data-motion="calm" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>musicmap</title>
<link rel="stylesheet" href="../../_look/tokens.css">
<link rel="stylesheet" href="map.css">
<script>/* no-flash theme: pref = system|light|dark */
(function(){var p=localStorage.getItem("musicmap:theme")||"system";document.documentElement.dataset.theme=p==="system"?(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):p;})();</script>
</head>
<body>
<header>
  <b class="brand">musicmap</b>
  <div class="search"><input id="q" type="search" placeholder="Search artist…" autocomplete="off" aria-label="Search artist"><ul id="hits" hidden></ul></div>
  <span class="grow"></span>
  <button id="mute" aria-pressed="true" data-tip="Hover preview (Deezer)">Preview: off</button>
  <button id="themeBtn" data-tip="Theme: system / light / dark">Theme: system</button>
</header>
<main>
  <canvas id="c" tabindex="0" aria-label="Artist map. Arrow keys move between artists."></canvas>
  <aside id="panel" hidden>
    <button id="close" aria-label="Close">×</button>
    <h2 id="pn"></h2><div id="pt" class="tags"></div>
    <h3>Similar artists</h3><ul id="pl"></ul>
  </aside>
  <div id="hint">Drag to pan · wheel to zoom · click an artist · arrow keys to move</div>
  <div id="tip" hidden></div>
</main>
<script src="map.js"></script>
<script src="app.js"></script>
</body>
</html>
